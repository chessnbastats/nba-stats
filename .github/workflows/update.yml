# Todos los días de madrugada: baja los datos, arma el sitio, guarda los datos en el repo y publica en GitHub Pages.
name: Actualizar y publicar

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC = 7:00 en Argentina (ya terminaron todos los partidos)
  workflow_dispatch:      # botón "Run workflow" para correrlo a mano
    inputs:
      prueba:
        description: "Prueba: publicar en Telegram la imagen de la última fecha jugada"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Si la API falla (o todavía no hay key), se publica igual con los datos que ya hay.
      - name: Bajar datos de Highlightly
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          HIGHLIGHTLY_BASE: ${{ vars.HIGHLIGHTLY_BASE }}
          MAX_REQUESTS: '90'
        run: node scripts/update.mjs

      # Fotos y fichas de jugadores desde los planteles públicos de ESPN (sin clave).
      - name: Fotos de jugadores
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/photos.mjs

      - name: Guardar los datos en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Datos $(date -u +%F)" && git push; }

      - name: Armar el sitio
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      # Imagen diaria "En racha hoy" (dist/share/hoy.png) y publicación en redes con claves cargadas.
      - name: Imagen del día
        continue-on-error: true
        run: node scripts/card.mjs hoy && node scripts/card.mjs ayer && node scripts/avatar.mjs

      - name: Publicar en redes
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SOCIAL_TEST: ${{ inputs.prueba }}
        run: |
          node scripts/social.mjs
          git add data/social.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Redes $(date -u +%F)" && git pull --rebase && git push; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
