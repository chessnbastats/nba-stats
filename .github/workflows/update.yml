# Todos los días de madrugada: baja los datos, arma el sitio, guarda los datos en el repo y publica en GitHub Pages.
name: Actualizar y publicar

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC = 7:00 en Argentina (ya terminaron todos los partidos)
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Si la API falla (o todavía no hay key), se publica igual con los datos que ya hay.
      - name: Bajar datos de Highlightly
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          HIGHLIGHTLY_BASE: ${{ vars.HIGHLIGHTLY_BASE }}
          MAX_REQUESTS: '90'
        run: node scripts/update.mjs

      - name: Guardar los datos en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/games ]; then git add data/games; fi
          git diff --cached --quiet || { git commit -m "Datos $(date -u +%F)" && git push; }

      - name: Armar el sitio
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
