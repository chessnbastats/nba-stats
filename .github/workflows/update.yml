# Todos los días de madrugada: baja los datos, arma el sitio, guarda los datos en el repo y publica en GitHub Pages.
name: Actualizar y publicar

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC = 7:00 en Argentina (ya terminaron todos los partidos)
  workflow_dispatch:      # botón "Run workflow" para correrlo a mano
    inputs:
      prueba:
        description: "Prueba: publicar en Telegram la imagen de la última fecha jugada"
        type: boolean
        default: false
      foto_canal:
        description: "Cambiar la foto del canal de Telegram por el logo"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Si la API falla (o todavía no hay key), se publica igual con los datos que ya hay.
      - name: Bajar datos de Highlightly
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          HIGHLIGHTLY_BASE: ${{ vars.HIGHLIGHTLY_BASE }}
          MAX_REQUESTS: '90'
        run: node scripts/update.mjs

      # Fotos y fichas de jugadores desde los planteles públicos de ESPN (sin clave).
      - name: Fotos de jugadores
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/photos.mjs

      - name: Guardar los datos en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Datos $(date -u +%F)" && git push; }

      - name: Armar el sitio
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      # Imagen diaria "En racha hoy" (dist/share/hoy.png) y publicación en redes con claves cargadas.
      - name: Imagen del día
        continue-on-error: true
        run: node scripts/card.mjs hoy && node scripts/card.mjs ayer && node scripts/avatar.mjs

      - name: Publicar en redes
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SOCIAL_TEST: ${{ inputs.prueba }}
          SOCIAL_PHOTO: ${{ inputs.foto_canal }}
        run: |
          node scripts/social.mjs
          git add data/social.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Redes $(date -u +%F)" && git pull --rebase && git push; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # A veces GitHub tarda en registrar el paquete recién subido y el primer intento falla:
      # se espera y se reintenta (hasta 2 veces).
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Instagram baja la imagen desde la página publicada, por eso va después de publicarla.
      - name: Publicar en Instagram
        if: github.event_name != 'push' && !inputs.foto_canal
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SOCIAL_TEST: ${{ inputs.prueba }}
        run: |
          git pull -q --rebase || true
          node scripts/social.mjs instagram
          git add data/social.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Instagram $(date -u +%F)" && git pull --rebase && git push; }

      # El token de Instagram vence a los 60 días: se renueva solo y se guarda en el secreto IG_TOKEN
      # (necesita el secreto GH_PAT con permiso para escribir secretos del repo).
      - name: Renovar token de Instagram
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FORCE: ${{ inputs.prueba }}
        run: |
          node scripts/ig-refresh.mjs > "$RUNNER_TEMP/ig" || exit 1
          if [ -s "$RUNNER_TEMP/ig" ]; then
            echo "::add-mask::$(cat "$RUNNER_TEMP/ig")"
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig"
          fi
          rm -f "$RUNNER_TEMP/ig"
